<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%2710%27 fill=%27%23245a46%27/%3E%3Cpath d=%27M11 27V20M20 27V12M29 27V16%27 stroke=%27%23d9ed9b%27 stroke-width=%273%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f5f0;--paper:#fff;--ink:#202c29;--muted:#68756f;--line:#dee4dd;--green:#245a46;--lime:#d9ed9b;--red:#a03e37;--orange:#f5e7cb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #8aaf4d;outline-offset:4px}button:disabled{opacity:.4;cursor:default}header{max-width:1240px;margin:auto;padding:23px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-1px;font-size:23px;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;background:var(--green);color:var(--lime);height:34px;width:34px;border-radius:10px;letter-spacing:-3px;padding-right:3px}.badge,.tag{font-size:12px;font-weight:650;border:1px solid var(--line);border-radius:30px;padding:5px 11px;display:inline-block}.badge{color:var(--muted)}main{max-width:1176px;margin:0 auto;padding:45px 0 70px}.eyebrow{text-transform:uppercase;letter-spacing:2px;color:var(--green);font-size:12px;font-weight:800}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,4.7vw,64px);line-height:1.13;letter-spacing:-2.7px;margin:20px 0 24px;max-width:770px}h1 em{color:var(--green);font-style:normal}h2{font-size:26px;line-height:1.35;letter-spacing:-.6px}h3{font-size:18px}.sub{max-width:630px;color:var(--muted);font-size:18px}.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:65px;align-items:center;padding:20px 0 45px}.hero-card{background:var(--green);color:white;border-radius:22px;padding:32px;box-shadow:0 16px 50px #244b3510;transform:rotate(2deg)}.hero-card h3{font-size:25px;margin:12px 0}.hero-card small{color:#cadccf}.mini-data{display:flex;gap:12px;padding:25px 0}.mini-data div{flex:1;border-top:1px solid #ffffff40;padding-top:15px}.mini-data strong{font-size:28px;display:block;color:var(--lime)}.flow{padding:16px;background:#ffffff10;border-radius:10px;font-size:14px}.btn{border:0;background:var(--green);color:white;padding:12px 21px;border-radius:10px;font-weight:650;display:inline-flex;justify-content:center;align-items:center;gap:9px;text-decoration:none}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.lime{background:var(--lime);color:var(--ink)}.buttons{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.facts{display:flex;gap:22px;margin:25px 0;font-size:13px;color:var(--muted)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.feature{padding:24px;background:#fff;border:1px solid var(--line);border-radius:14px}.feature span{font:13px ui-monospace,monospace;color:var(--green)}.feature h3{margin:13px 0 6px}.feature p{font-size:14px;color:var(--muted);margin:0}.note{font-size:13px;color:var(--muted);margin:20px 0 0}.workspace{display:grid;grid-template-columns:235px minmax(0,1fr);gap:32px}.sidebar{align-self:start;position:sticky;top:25px}.sidebar h3{margin:14px 0 4px}.muted{color:var(--muted)}.small{font-size:13px}.numbers{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0}.num{border:1px solid var(--line);border-radius:9px;height:42px;background:#fff;color:var(--muted)}.num.answered{background:#e4ebdc;color:var(--green);border-color:#d3dec9}.num.current{background:var(--green);color:#fff;border-color:var(--green)}.progress{height:5px;background:#dfe5db;border-radius:5px;overflow:hidden;margin:12px 0}.progress div{height:100%;background:var(--green);transition:width .2s}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:34px}.q-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:22px}.tag{background:#f1f4e9;border-color:#e3e9d7;color:var(--green)}.q-count{margin-left:auto;font-size:13px;color:var(--muted)}.context{padding:18px 20px;background:#f6f7f2;border-left:3px solid #9ab65f;border-radius:0 8px 8px 0;margin:20px 0;color:#47554c;font-size:15px}.table-wrap{overflow-x:auto;margin:22px 0}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px;white-space:nowrap}th{background:#f4f6ef;color:#65725e;font-size:12px}td,th{padding:12px 15px;border-bottom:1px solid var(--line)}.question{margin:25px 0 18px;font-weight:650;font-size:18px}.options{display:grid;gap:11px}.option{position:relative;display:flex;align-items:flex-start;gap:13px;padding:15px 17px;border:1px solid var(--line);border-radius:11px;cursor:pointer;transition:background .15s,border-color .15s}.option:hover{background:#f7f9f2}.option:has(input:checked){background:#edf3e2;border-color:#759647}.option input{margin:7px 0 0;accent-color:var(--green);flex-shrink:0}.option .letter{font-size:12px;color:var(--muted);font-weight:700;margin-right:7px}.numeric-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.numeric-row input{border:1px solid #aebbaa;border-radius:10px;width:210px;padding:13px 16px;font-size:23px;background:#fff}.unit{font-size:14px;color:var(--muted)}.hint-btn{border:0;background:transparent;color:var(--green);padding:13px 0;text-decoration:underline;text-underline-offset:4px;font-size:14px}.hint{background:#f7f3e8;padding:13px 17px;font-size:14px;border-radius:9px;margin:0 0 15px}.nav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:24px;margin-top:30px}.status{color:var(--muted);font-size:13px;min-height:24px}.warn{color:var(--red);font-size:14px}.finish-panel{margin-top:20px;padding:20px;background:#f6f7f2;border-radius:10px}.result-head{display:flex;justify-content:space-between;gap:30px;align-items:center;margin-bottom:30px}.score{font-size:62px;font-weight:800;line-height:1;color:var(--green);letter-spacing:-3px}.score small{font-size:22px;letter-spacing:0;color:var(--muted)}.result-summary{max-width:620px}.skill-row{padding:13px 0;display:flex;justify-content:space-between;font-size:14px;border-bottom:1px solid var(--line);gap:16px}.result-skills{display:grid;grid-template-columns:1fr 1fr;gap:0 35px;margin:25px 0}.review-item{border:1px solid var(--line);border-radius:13px;background:#fff;margin-top:14px;padding:22px}.review-item summary{cursor:pointer;list-style:none;display:flex;gap:14px;align-items:center;font-weight:650}.review-item summary::-webkit-details-marker{display:none}.pill{border-radius:30px;background:#edf3e2;color:var(--green);font-size:12px;padding:3px 10px;white-space:nowrap}.pill.bad{background:#f9eae7;color:var(--red)}.review-body{border-top:1px solid var(--line);padding-top:17px;margin-top:17px;font-size:15px}.review-body p{margin:0 0 12px}.review-body .source{font-size:12px;color:var(--muted);margin-bottom:0}.formula{font-family:ui-monospace,monospace;padding:11px 14px;background:#f6f7f2;border-radius:8px;font-size:13px;overflow-wrap:anywhere}.review-title{margin-top:35px}.footer{max-width:1176px;margin:0 auto;padding:20px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}fieldset{border:0;padding:0;margin:0;min-width:0}legend{padding:0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:1230px){main,.footer{margin-left:26px;margin-right:26px}}@media(max-width:760px){header{padding:18px 20px}.hero{grid-template-columns:1fr;gap:30px}.hero-card{transform:none}.grid3{grid-template-columns:1fr}.workspace{grid-template-columns:1fr;gap:20px}.sidebar{position:static}.sidebar .numbers{grid-template-columns:repeat(12,1fr);gap:5px;margin:12px 0}.num{height:34px;font-size:12px}.sidebar .side-info{display:none}main{padding-top:25px;margin:0 18px}.card{padding:24px 20px}.result-head{align-items:flex-start;flex-direction:column}.result-skills{grid-template-columns:1fr}.facts{gap:13px;flex-wrap:wrap}.footer{margin:0 18px}.q-count{width:100%;margin-left:0}h1{letter-spacing:-1.7px}}@media(max-width:420px){.sidebar .numbers{grid-template-columns:repeat(6,1fr)}.nav .btn{padding:11px 14px}.badge{font-size:10px}.brand{font-size:20px}}
</style>

<header><div class="brand"><span class="mark" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 18v-7m7 7V5m7 13V9" stroke="currentColor" stroke-width="2.5" fill="none"/></svg></span>metric lab<span style="color:#92aa69">.</span></div><span class="badge">BẢN THỬ · TIẾNG VIỆT</span></header>

<footer class="footer"><span>Luyện tính toán. Hiểu dữ liệu. Ra quyết định.</span><span>Không dùng ngân sách quảng cáo thật.</span></footer>
<script>
'use strict';
const questions=[
{id:'cpi',skill:'Tính chỉ số',industry:'Mobile app',type:'number',title:'Một lượt cài đặt thực sự có giá bao nhiêu?',context:'Ứng dụng tiện ích chạy tại US. CTR = click / impression; CVR = install / click. Tất cả số liệu thuộc cùng kỳ và cùng nguồn đo.',headers:['CPM','CTR','CVR (click → install)'],rows:[['$23,50','3,3%','32%']],ask:'Tính CPI của creative này, làm tròn đến 2 chữ số thập phân.',unit:'USD / install',correct:23.50/(1000*.033*.32),tolerance:.02,hint:'Từ 1.000 impression, tính số click rồi số install. Chia chi phí cho số install.',answer:'Khoảng $2,23 / install',formula:'CPI = CPM / (1.000 × CTR × CVR) = 23,5 / (1.000 × 0,033 × 0,32)',explanation:'1.000 impression tạo 33 click và 10,56 install kỳ vọng. CPI khoảng $2,23. Tỷ lệ phần trăm phải đổi sang số thập phân khi tính.',source:'Chuyển thể từ dạng bài creative UA trong đề IKAME do bạn cung cấp; đã làm rõ định nghĩa CVR.'},
{id:'cpql',skill:'Tính chỉ số',industry:'Giáo dục',type:'number',title:'Lead rẻ chưa chắc là lead chất lượng',context:'Một trung tâm ngoại ngữ chi 12.000.000đ và thu 200 lead. Sau khi sales xác minh, 60 lead đáp ứng tiêu chí về nhu cầu và khả năng học phí.',headers:['Chi phí quảng cáo','Lead','Qualified lead'],rows:[['12.000.000đ','200','60']],ask:'Chi phí cho mỗi qualified lead (CPQL) là bao nhiêu?',unit:'đồng / qualified lead — nhập số nguyên, không tách hàng nghìn',correct:200000,tolerance:1,hint:'Mẫu số là số lead đạt chuẩn, không phải tổng số lead.',answer:'200.000đ / qualified lead',formula:'CPQL = Cost / Qualified leads = 12.000.000 / 60',explanation:'CPL là 60.000đ, còn CPQL là 200.000đ. Khi mục tiêu là lead đạt chuẩn, chọn sai mẫu số sẽ làm bạn đánh giá quá cao hiệu suất.',source:'Bài mới, tham khảo funnel và cách chọn KPI ở DPM029 buổi 1 và buổi 9.'},
{id:'campaign',skill:'Hiệu quả kinh doanh',industry:'Thương mại điện tử',type:'choice',title:'CR cao hơn, có đáng ưu tiên hơn?',context:'Bạn có ngân sách cố định và muốn tối đa hóa doanh thu. Giả định hai campaign còn khả năng nhận thêm ngân sách và giữ nguyên CPC, CR, AOV; cùng cách đo doanh thu.',headers:['Campaign','CPC','CR (click → order)','AOV'],rows:[['A','3.500đ','1,5%','420.000đ'],['B','2.000đ','1,0%','400.000đ']],ask:'Theo các giả định trên, nên ưu tiên campaign nào?',options:['A, vì CR cao hơn.','B, vì ROAS bằng 2,0 so với 1,8 của A.','A, vì giá trị đơn hàng cao hơn.','Hai campaign tương đương vì chưa biết số click.'],correct:1,hint:'Tính doanh thu kỳ vọng từ một click rồi so với chi phí mua click.',answer:'B — ROAS 2,0, cao hơn A (1,8)',formula:'ROAS = CR × AOV / CPC. A = 0,015 × 420.000 / 3.500 = 1,8; B = 2,0',explanation:'CR và AOV đều tốt hơn không đảm bảo ROAS tốt hơn nếu chi phí mua traffic quá cao. Trong thực tế cần kiểm tra lại hiệu suất khi tăng chi tiêu; đề đã cố định giả định này.',source:'Chuyển thể case DPM029 buổi 7, trang 6–8.'},
{id:'game',skill:'Đọc dữ liệu & kiểm thử',industry:'Game mobile',type:'choice',title:'CPI rẻ hay người dùng ở lại lâu?',context:'Hai nguồn thu hút người chơi mới cho cùng một game, cùng quốc gia và cohort đã đủ 7 ngày. Bạn đang đánh giá khả năng sinh lời.',headers:['Nguồn','CPI','Retention D7'],rows:[['A','$0,80','6%'],['B','$1,40','18%']],ask:'Kết luận nào phù hợp nhất với dữ liệu hiện có?',options:['A chắc chắn sinh lời hơn vì CPI thấp.','B chắc chắn sinh lời hơn vì retention cao.','Cần thêm doanh thu/LTV theo cohort và chi phí để so hiệu quả; CPI và D7 chưa đủ.','Lấy CPI chia retention là tính được ROAS.'],correct:2,hint:'Ở lại lâu và tạo doanh thu là hai khái niệm khác nhau.',answer:'Cần thêm dữ liệu doanh thu/LTV theo cohort và chi phí',explanation:'Retention là tín hiệu về chất lượng và khả năng giữ chân, nhưng chưa cho biết doanh thu quảng cáo hoặc IAP. Có thể so chi phí trên người còn hoạt động D7, nhưng đó chưa phải lợi nhuận hay ROAS.',source:'Bài mở rộng UA mới; không phải nội dung đã có đầy đủ trong bộ slide.'},
{id:'hook',skill:'Chẩn đoán chiến dịch',industry:'Ứng dụng sức khỏe',type:'choice',title:'Hook thắng, nhưng cả video chưa thắng',context:'Với video 20 giây: Hook rate = lượt xem ≥3 giây / impression; Hold rate = lượt xem ≥15 giây / lượt xem ≥3 giây; CTR = link click / impression.',headers:['Hook rate','Hold rate','CTR'],rows:[['55%','3%','1%']],ask:'Bước phân tích tiếp theo nào hợp lý nhất?',options:['Khẳng định người dùng đã chán ứng dụng.','Tăng ngân sách ngay vì hook trên 50%.','Kiểm tra đường giữ chân và đoạn sau hook; đặt giả thuyết nội dung không nối được lời hứa mở đầu, rồi test.','Chỉ thay màu nút CTA, vì CTR thấp luôn do màu sắc.'],correct:2,hint:'Chỉ số gợi ý vị trí cần tìm hiểu, chưa chứng minh nguyên nhân.',answer:'Kiểm tra đoạn sau hook, đặt giả thuyết và kiểm chứng',explanation:'Hook thu hút được sự chú ý ban đầu, nhưng rất ít người xem qua mốc tiếp theo. Cần xem video, drop-off, thông điệp và phân phối audience. Không thể xác lập nguyên nhân chỉ từ ba tỷ lệ.',source:'Bài mới lấy cảm hứng từ cách hỏi Hook/Hold/CTR trong đề IKAME; các mốc đo được quy định riêng cho bài.'},
{id:'delay',skill:'Chẩn đoán chiến dịch',industry:'Bất động sản',type:'choice',title:'Chạy ba ngày, chưa có giao dịch',context:'Chiến dịch mới chạy 3 ngày, có 25 lead đang được sales liên hệ. Dữ liệu lịch sử cho thấy khách thường mất 7–60 ngày từ lead tới giao dịch. Tracking vẫn hoạt động.',ask:'Hành động nào hợp lý nhất lúc này?',options:['Tắt toàn bộ vì ROAS ba ngày bằng 0.','Tăng gấp đôi ngân sách vì đã có 25 lead.','Kiểm tra chất lượng lead, tiến độ sales và các cohort đủ tuổi; chưa kết luận từ giao dịch trong 3 ngày.','Bỏ đo giao dịch và chỉ đánh giá theo số lead mãi mãi.'],correct:2,hint:'Thời gian đánh giá cần phù hợp với độ trễ chuyển đổi.',answer:'Đánh giá chất lượng lead và các cohort đủ tuổi',explanation:'Chưa có giao dịch trong ba ngày không đủ chứng minh thất bại với chu kỳ 7–60 ngày. Vẫn phải theo dõi tín hiệu sớm và giới hạn chi tiêu; không có nghĩa cứ chờ mà bỏ kiểm soát chất lượng.',source:'Tham khảo vấn đề lead time ở DPM029 buổi 7, trang 14.'},
{id:'travel',skill:'Hiệu quả kinh doanh',industry:'Du lịch',type:'choice',title:'ROAS đẹp trên báo cáo booking',context:'Campaign A có ROAS theo giá trị booking là 8,0; B là 5,0. Hai nhóm tour có tỷ lệ hủy/hoàn và biên lợi nhuận khác nhau, nhưng bạn chưa có các số liệu đó. Mục tiêu là lợi nhuận.',ask:'Nên bổ sung dữ liệu gì trước khi quyết định tăng ngân sách?',options:['Chỉ cần CTR; campaign CTR cao sẽ có lợi nhuận cao hơn.','Doanh thu sau hủy/hoàn và chi phí biến đổi của tour để tính phần lợi nhuận còn lại sau quảng cáo.','Chỉ số lượt thích bài quảng cáo.','Không cần thêm dữ liệu: ROAS 8,0 luôn tốt hơn 5,0 về lợi nhuận.'],correct:1,hint:'Doanh thu đặt chỗ ban đầu chưa phải khoản tiền và lợi nhuận thực giữ lại.',answer:'Doanh thu sau hủy/hoàn và chi phí biến đổi',explanation:'Tour biên mỏng hoặc bị hủy nhiều có thể tạo ROAS booking cao nhưng lợi nhuận thấp. Cần cùng kỳ đo, doanh thu thực và chi phí liên quan trước khi so sánh.',source:'Bài đa ngành mới, mở rộng nguyên tắc chọn KPI sát kết quả kinh doanh.'},
{id:'attribution',skill:'Đọc dữ liệu & kiểm thử',industry:'Bán lẻ đa kênh',type:'choice',title:'Một đơn hàng, ba hệ thống báo cáo',context:'Khách click quảng cáo Meta, sau đó Google, rồi mở email và mua. Backend xác nhận đúng 1 đơn. Meta báo 1 conversion; Google báo 1 conversion; analytics với quy tắc last-click của bài gán đơn cho email.',ask:'Nên diễn giải kết quả như thế nào?',options:['Có 3 đơn vì tổng conversion các nền tảng là 3.','Chắc chắn Meta và Google đang lỗi tracking.','Có 1 đơn thực; khác biệt có thể do attribution model/window, cần đối soát trước khi tổng hợp.','Email đã tạo toàn bộ nhu cầu, nên tắt hai kênh ads.'],correct:2,hint:'Credit mà hệ thống gán cho một kênh không phải số đơn mới được tạo thêm.',answer:'Một đơn thực; đối soát quy tắc attribution',explanation:'Các hệ thống có thể cùng nhận credit cho một đơn. Last-click cũng không chứng minh kênh cuối tạo ra toàn bộ tác động. Không cộng conversion tự nhận của từng nền tảng thành tổng đơn thực.',source:'Chuyển thể DPM029 buổi 9, trang 66–68; đã nêu rõ quy tắc đo trong bài.'},

const KEY='metric-lab-demo-v1';
let answers={},index=0,started=false,submitted=false,hints={},saveEnabled=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&saved.version===1){for(const q of questions){const v=saved.answers?.[q.id];if((q.type==='number'&&typeof v==='string'&&v.length<50)||(q.type==='choice'&&Number.isInteger(v)&&v>=0&&v<q.options.length))answers[q.id]=v;}index=Math.min(11,Math.max(0,Number.isInteger(saved.index)?saved.index:0));submitted=saved.submitted===true;}}catch(e){saveEnabled=false;}
const el=document.getElementById('main');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function numberValue(value){const s=String(value??'').trim();if(!/^[+-]?(?:\d+(?:[.,]\d+)?|[.,]\d+)$/.test(s))return NaN;return Number(s.replace(',','.'));}
function answered(q){return q.type==='number'?Number.isFinite(numberValue(answers[q.id])):Number.isInteger(answers[q.id]);}
function isCorrect(q){return answered(q)&&(q.type==='number'?Math.abs(numberValue(answers[q.id])-q.correct)<=q.tolerance:answers[q.id]===q.correct);}
function count(){return questions.filter(answered).length;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,answers,index,submitted}));}catch(e){saveEnabled=false;}}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function home(){started=false;el.innerHTML=`<section class="hero"><div><div class="eyebrow">Performance marketing playground</div><h1>Đọc đúng số.<br><em>Quyết định tốt hơn.</em></h1><p class="sub">Thử sức với những tình huống marketing đa ngành. Từ một công thức CPI đến quyết định phân bổ ngân sách.</p><div class="facts"><span>12 câu hỏi</span><span>Khoảng 10–15 phút</span><span>Có lời giải từng câu</span></div><div class="buttons"><button class="btn" id="start">${count()?submitted?'Xem kết quả đã làm':'Tiếp tục bài đang làm':'Bắt đầu làm thử'} <span aria-hidden="true">&rarr;</span></button>${count()?'<button class="btn secondary" id="new">Làm bài mới</button>':''}</div><p class="note">${saveEnabled?'Tiến độ được lưu trong trình duyệt trên thiết bị này.':'Trình duyệt không cho lưu tiến độ; hãy hoàn tất trong phiên này.'} Không cần tài khoản.</p></div><div class="hero-card"><small>MỘT TÌNH HUỐNG QUEN THUỘC</small><h3>Lead rẻ hơn.<br>Khách hàng có rẻ hơn?</h3><div class="mini-data"><div><small>CPL</small><strong>↓ 30%</strong></div><div><small>CAC</small><strong>↑ 45%</strong></div></div><div class="flow">Đọc bối cảnh → Tính & chọn → Xem lời giải</div><p class="small" style="margin:20px 0 0;color:#d5e2d7">Đừng chỉ chọn con số đẹp. Hãy chọn chỉ số đúng với mục tiêu.</p></div></section><section class="grid3"><div class="feature"><span>01 / TÍNH TOÁN</span><h3>Hiểu công thức</h3><p>CPI, CPQL, ROAS, payback và mối liên hệ giữa các chỉ số.</p></div><div class="feature"><span>02 / PHÂN TÍCH</span><h3>Đặt đúng câu hỏi</h3><p>Creative, funnel, attribution và dữ liệu còn thiếu để ra quyết định.</p></div><div class="feature"><span>03 / ỨNG DỤNG</span><h3>Đổi góc nhìn theo ngành</h3><p>App/game, giáo dục, bán lẻ, du lịch, bất động sản và SaaS.</p></div></section><p class="note">Dữ liệu mô phỏng phục vụ học tập. Tham khảo dạng bài DPM029 và đề IKAME bạn cung cấp; giả định và định nghĩa được ghi riêng trong từng câu. Chưa có bài tự luận/visual brief trong bản thử này.</p>`;document.getElementById('start').onclick=()=>{started=true;submitted?results():renderQuestion();scrollTop();};const b=document.getElementById('new');if(b)b.onclick=reset;}
function reset(){if(!confirm('Xóa bài làm hiện tại và bắt đầu lại cùng bộ câu hỏi?'))return;answers={};index=0;submitted=false;hints={};started=true;persist();renderQuestion();scrollTop();}
function dataTable(q){return q.rows?`<div class="table-wrap"><table><caption class="sr-only">Dữ liệu tình huống</caption><thead><tr>${q.headers.map(x=>`<th scope="col">${esc(x)}</th>`).join('')}</tr></thead><tbody>${q.rows.map(row=>`<tr>${row.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';}
function renderQuestion(){const q=questions[index];el.innerHTML=`<div class="workspace"><aside class="sidebar"><div class="eyebrow">Bài luyện tổng hợp</div><h3>Đi từng bước một.</h3><p class="muted small">Có thể quay lại sửa trước khi nộp.</p><div class="progress" role="progressbar" aria-label="Số câu đã trả lời" aria-valuemin="0" aria-valuemax="12" aria-valuenow="${count()}"><div style="width:${count()/12*100}%"></div></div><div id="progress-text" class="small muted">Đã trả lời ${count()}/12</div><nav aria-label="Đi tới câu hỏi" class="numbers">${questions.map((x,i)=>`<button class="num ${answered(x)?'answered ':''}${i===index?'current':''}" ${i===index?'aria-current="step"':''} data-go="${i}" aria-label="Câu ${i+1}${answered(x)?', đã trả lời':''}">${i+1}</button>`).join('')}</nav><div class="side-info"><p class="small muted">Bạn có thể dùng máy tính. Gợi ý không trừ điểm. Câu bỏ trống không được tính điểm.</p><button class="btn secondary" id="review-submit">Nộp bài</button><p class="note">${saveEnabled?'Lưu cục bộ trên trình duyệt.':'Không lưu được trên trình duyệt này.'}</p></div></aside><section class="card" aria-label="Câu hỏi hiện tại"><div class="q-top"><span class="tag">${esc(q.industry)}</span><span class="tag">${esc(q.skill)}</span><span class="q-count">Câu ${index+1} / 12</span></div><h2 id="q-title" tabindex="-1">${esc(q.title)}</h2><div class="context">${esc(q.context)}</div>${dataTable(q)}<fieldset><legend class="question">${esc(q.ask)}</legend>${q.type==='choice'?`<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${answers[q.id]===i?'checked':''}><span><span class="letter">${String.fromCharCode(65+i)}</span>${esc(o)}</span></label>`).join('')}</div>`:`<label class="sr-only" for="numeric">Đáp án bằng số</label><div class="numeric-row"><input id="numeric" type="text" inputmode="decimal" autocomplete="off" maxlength="40" placeholder="Nhập kết quả" value="${esc(answers[q.id]??'')}" aria-describedby="unit input-status"><span class="unit" id="unit">${esc(q.unit)}</span></div><p class="note" style="margin-top:10px">Dùng dấu phẩy hoặc dấu chấm cho phần thập phân; không dùng dấu tách hàng nghìn.</p>`}</fieldset><button class="hint-btn" id="hint-toggle" aria-expanded="${!!hints[q.id]}" aria-controls="hint-box">${hints[q.id]?'Ẩn gợi ý':'Cần một gợi ý?'}</button><div class="hint" id="hint-box" ${hints[q.id]?'':'hidden'}>${esc(q.hint)}</div><div id="input-status" class="status" aria-live="polite"></div><div class="nav"><button class="btn secondary" id="prev" ${index===0?'disabled':''}>← Câu trước</button><button class="btn" id="next">${index===11?'Xem lại & nộp':'Câu tiếp →'}</button></div><div class="finish-panel" id="finish-panel" hidden></div></section></div>`;
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(Number(b.dataset.go)));
 document.querySelectorAll('input[name="answer"]').forEach(inp=>inp.onchange=()=>{answers[q.id]=Number(inp.value);update();});
 const input=document.getElementById('numeric');if(input)input.oninput=()=>{answers[q.id]=input.value;update();};
 document.getElementById('hint-toggle').onclick=()=>{hints[q.id]=!hints[q.id];const show=!!hints[q.id];document.getElementById('hint-box').hidden=!show;const b=document.getElementById('hint-toggle');b.setAttribute('aria-expanded',show);b.textContent=show?'Ẩn gợi ý':'Cần một gợi ý?';};
 document.getElementById('prev').onclick=()=>go(index-1);document.getElementById('next').onclick=()=>index===11?showSubmit():go(index+1);document.getElementById('review-submit').onclick=showSubmit;update(false);
}
function update(save=true){if(save)persist();const q=questions[index];document.getElementById('progress-text').textContent=`Đã trả lời ${count()}/12`;const bar=document.querySelector('[role="progressbar"]');bar.setAttribute('aria-valuenow',count());bar.firstElementChild.style.width=`${count()/12*100}%`;document.querySelectorAll('[data-go]').forEach(b=>{const x=questions[Number(b.dataset.go)];b.classList.toggle('answered',answered(x));b.setAttribute('aria-label',`Câu ${Number(b.dataset.go)+1}${answered(x)?', đã trả lời':''}`);});const invalid=q.type==='number'&&String(answers[q.id]??'').trim()&&!answered(q);document.getElementById('input-status').textContent=invalid?'Chưa nhận được số hợp lệ. Ví dụ: 2,23 hoặc 200000.':answered(q)?'Đã ghi nhận câu trả lời. Bạn vẫn có thể sửa.':'';document.getElementById('input-status').classList.toggle('warn',!!invalid);const input=document.getElementById('numeric');if(input)input.setAttribute('aria-invalid',invalid?'true':'false');document.getElementById('finish-panel').hidden=true;}
function go(i){index=Math.min(11,Math.max(0,i));persist();renderQuestion();document.getElementById('q-title').focus({preventScroll:true});scrollTop();}
function showSubmit(){const missing=questions.map((q,i)=>answered(q)?null:i+1).filter(Boolean);const panel=document.getElementById('finish-panel');panel.hidden=false;panel.innerHTML=`<h3>Sẵn sàng xem kết quả?</h3><p class="small ${missing.length?'warn':'muted'}">${missing.length?`Còn ${missing.length} câu chưa có đáp án hợp lệ: ${missing.join(', ')}. Câu bỏ trống sẽ được tính là chưa đúng.`:'Bạn đã trả lời đủ 12 câu. Nộp bài để xem điểm và lời giải.'}</p><div class="buttons"><button class="btn" id="confirm-submit">${missing.length?'Vẫn nộp bài':'Nộp bài & xem lời giải'}</button><button class="btn secondary" id="back-edit">Tiếp tục làm</button></div>`;document.getElementById('back-edit').onclick=()=>panel.hidden=true;document.getElementById('confirm-submit').onclick=()=>{submitted=true;persist();results();scrollTop();};panel.scrollIntoView({behavior:'smooth',block:'nearest'});document.getElementById('confirm-submit').focus({preventScroll:true});}
function answerText(q){if(!answered(q))return 'Chưa trả lời / chưa nhập số hợp lệ';return q.type==='choice'?q.options[answers[q.id]]:String(answers[q.id])+' '+q.unit.split(' — ')[0];}
function results(){const n=questions.filter(isCorrect).length;const skills=[...new Set(questions.map(q=>q.skill))];const scored=skills.map(name=>({name,correct:questions.filter(q=>q.skill===name&&isCorrect(q)).length,total:questions.filter(q=>q.skill===name).length}));const weakest=scored.filter(s=>s.correct<s.total).sort((a,b)=>a.correct/a.total-b.correct/b.total);el.innerHTML=`<section class="card"><div class="result-head"><div class="result-summary"><div class="eyebrow">Bài luyện đã hoàn thành</div><h1 style="font-size:39px;margin:14px 0">${n>=10?'Bạn đang nối các dữ liệu khá tốt.':n>=6?'Đã có nền tảng. Cùng xem lại vài điểm.':'Mỗi câu sai là một chỗ để luyện tiếp.'}</h1><p class="muted" style="margin:0">Đúng ${n}/12 câu · ${Math.round(n/12*100)}% · ${12-count()} câu bỏ trống hoặc nhập chưa hợp lệ. Mỗi câu có trọng số như nhau.</p></div><div class="score">${n}<small> / 12</small></div></div><div class="result-skills">${scored.map(s=>`<div class="skill-row"><span>${esc(s.name)}</span><strong>${s.correct}/${s.total}</strong></div>`).join('')}</div><div class="context">${weakest.length?`Ưu tiên ôn: <strong>${esc(weakest[0].name)}</strong>. Mở lời giải bên dưới, kiểm tra công thức, mục tiêu và giả định trước khi chọn hành động.`:'Bạn trả lời đúng toàn bộ bộ câu hỏi này. Hãy thử giải thích lại lý do và chỉ ra khi nào giả định của bài không còn đúng.'}</div><p class="small muted">Điểm này chỉ phản ánh 12 câu thử nghiệm, chưa đánh giá đầy đủ năng lực thực chiến hay khả năng viết concept/visual brief.</p><div class="buttons"><button class="btn" id="retry">Làm lại bài</button><button class="btn secondary" id="home">Về trang đầu</button><button class="btn secondary" id="download">Tải kết quả .txt</button></div></section><h2 class="review-title">Lời giải & cách suy luận</h2><p class="muted small">Câu chưa đúng được mở sẵn. Bạn có thể mở từng câu còn lại để xem giải thích.</p>${questions.map((q,i)=>`<details class="review-item" ${isCorrect(q)?'':'open'}><summary><span class="pill ${isCorrect(q)?'':'bad'}">${isCorrect(q)?'Đúng':answered(q)?'Chưa đúng':'Bỏ trống'}</span><span>${i+1}. ${esc(q.title)}</span><span style="margin-left:auto;color:#87967e" aria-hidden="true">＋</span></summary><div class="review-body"><p><strong>Bạn chọn:</strong> ${esc(answerText(q))}</p><p><strong>Đáp án:</strong> ${esc(q.answer)}</p>${q.formula?`<p class="formula">${esc(q.formula)}</p>`:''}<p>${esc(q.explanation)}</p><p class="source">${esc(q.source)}</p></div></details>`).join('')}`;document.getElementById('retry').onclick=reset;document.getElementById('home').onclick=()=>{home();scrollTop();};document.getElementById('download').onclick=downloadResults;}
function downloadResults(){const n=questions.filter(isCorrect).length;const content=`METRIC LAB — KẾT QUẢ BÀI THỬ\nĐúng: ${n}/12 (${Math.round(n/12*100)}%)\n\n`+questions.map((q,i)=>`${i+1}. ${q.title}\n${isCorrect(q)?'ĐÚNG':answered(q)?'CHƯA ĐÚNG':'BỎ TRỐNG'}\nBài làm: ${answerText(q)}\nĐáp án: ${q.answer}\n${q.formula||''}\n${q.explanation}\n`).join('\n');const url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='metric-lab-ket-qua.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
home();
</script>
</body>
</html>
